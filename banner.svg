<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0A0800"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="goldGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFD700" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#goldGrid)"/>

  <!-- The All-Seeing Eye / Interceptor Core -->
  <g transform="translate(950, 200)" stroke="#FFD700" stroke-width="2" fill="none" opacity="0.8" filter="url(#goldGlow)">
    <!-- Hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" stroke-width="3" />
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" stroke-width="1" opacity="0.5"/>
    <!-- Central Eye / Socket -->
    <circle cx="0" cy="0" r="30" fill="#000000" stroke="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="#FFD700" />
    <!-- Data Lines -->
    <line x1="-104" y1="0" x2="-180" y2="0" stroke-width="1" />
    <line x1="104" y1="0" x2="180" y2="0" stroke-width="1" />
    <line x1="0" y1="-120" x2="0" y2="-180" stroke-width="1" />
    <line x1="0" y1="120" x2="0" y2="180" stroke-width="1" />
  </g>

  <!-- Typography -->
  <text x="60" y="200" font-family="Impact, sans-serif" font-size="120" font-weight="900" fill="url(#goldGrad)" letter-spacing="8" filter="url(#goldGlow)">SOVEREIGN</text>
  <text x="65" y="240" font-family="Courier New, monospace" font-size="18" fill="#FFD700" letter-spacing="4">ABSOLUTE NETWORK INTERCEPTOR</text>

  <!-- Terminal Data -->
  <g transform="translate(65, 280)">
    <rect x="0" y="0" width="600" height="1" fill="#FFD700" opacity="0.5"/>
    <text x="0" y="20" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; SOCKET: <tspan fill="#FFD700">AF_PACKET (RAW)</tspan></text>
    <text x="0" y="40" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" opacity="0.8">&gt; FIREWALL_BYPASS: <tspan fill="#FFD700">TRUE</tspan></text>
    <text x="0" y="60" font-family="Courier New, monospace" font-size="12" fill="#FFFFFF" font-weight="bold">&gt; STATUS: OMNISCIENT.</text>
  </g>
</svg>
